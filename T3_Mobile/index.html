<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador de Corrida - Mobile</title>
    <link rel="shortcut icon" href="../favicon.ico">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser zoom/scroll */
        }

        /* --- LOADING SCREEN CSS --- */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            background-image: url('../assets/textures/skybox/panorama1.jpg');
            background-size: cover;
            background-position: center;
            z-index: 100; /* Highest priority */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #loading-container {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 2px solid #444;
            max-width: 400px;
            width: 80%;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #progress-container {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid #555;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8800);
            transition: width 0.2s;
        }

        #loading-text {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            min-height: 20px;
        }

        #start-button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        #start-button:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        /* --- MOBILE UI CSS --- */
        #joystickWrapper1 {
            pointer-events: auto;
            position: absolute;       
            bottom: 20px;
            left: 20px;
            display: block; 
            touch-action: manipulation;
            z-index: 20; 
        }

        #left-controls-top {
            position: absolute;
            bottom: 180px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        #right-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 25px;
            z-index: 20;
        }

        .hud-row {
            display: flex;
            gap: 20px;
        }

        .hud-btn {
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.1s;
        }

        .hud-btn:active, .hud-btn.active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .track-btn {
            width: 50px;
            height: 50px;
            background-color: rgba(0, 100, 255, 0.6);
            font-size: 20px;
        }

        .gas-btn {
            width: 90px;
            height: 90px;
            background-color: rgba(0, 200, 0, 0.5); /* Green */
            font-size: 16px;
        }

        .brake-btn {
            width: 70px;
            height: 70px;
            background-color: rgba(200, 0, 0, 0.5); /* Red */
            font-size: 14px;
            margin-top: 20px; /* Align nicely */
        }

        .shoot-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 140, 0, 0.6); /* Orange */
            border-radius: 20px;
            font-size: 30px;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Loaders de Mapas de Importação (Importante para Modules) -->
    <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
    <script type="importmap"> 
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
          }
        }
    </script> 

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div id="loading-container">
            <h1>Mobile T3</h1>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="loading-text">Iniciando...</div>
            <button id="start-button">START</button>
        </div>
    </div>

    <!-- Interface Mobile -->
    
    <!-- Esquerda: Joystick + Seleção de Pista -->
    <div id="joystickWrapper1"></div>
    
    <div id="left-controls-top">
        <div class="hud-btn track-btn" id="btn-t1">1</div>
        <div class="hud-btn track-btn" id="btn-t2">2</div>
        <div class="hud-btn track-btn" id="btn-t3">3</div>
    </div>

    <!-- Direita: Acelerador, Freio, Tiro -->
    <div id="right-controls">
        <div class="hud-btn shoot-btn" id="btn-shoot">🔥</div>
        <div class="hud-row">
            <div class="hud-btn brake-btn" id="btn-brake">RÉ</div>
            <div class="hud-btn gas-btn" id="btn-gas">GAS</div>
        </div>
    </div>

    <!-- Info Debug -->
    <div id="info">
        Velocidade: 0 km/h
    </div>

    <!-- Scripts de Biblioteca -->
    <script src="../libs/other/nipplejs.js"></script>

    <!-- Script Principal do Jogo -->
    <script type="module" src="main.js"></script>

</body>
</html>
