<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Multiplayer - Esferas</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0f1a;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #e8eef8;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 10;
    }

    #lobby-panel {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    #lobby-players div {
      font-size: 12px;
      color: #cfd8e6;
    }

    #ready-button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: #2f6bff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    #ready-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>Teste Multiplayer - Esferas</strong></div>
    <div>Setas: mover esfera no plano XZ</div>
    <div id="status">Conectando...</div>
    <div id="lobby-panel">
      <div id="lobby-status">Aguardando jogadores...</div>
      <div id="lobby-players"></div>
      <button id="ready-button">Ready</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="../MultiplayerEngine.js?v=2026-06-01"></script>
  <script type="module" src="app.js?v=2026-06-01"></script>
</body>
</html>
