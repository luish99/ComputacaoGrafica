<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Corrida - T3</title>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #000; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #instructions {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #instructions h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 1px solid #555;
      padding-bottom: 5px;
    }
    
    /* Loading Screen Styles */
    #loading-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #111;
        background-image: url('../assets/textures/skybox/panorama1.jpg'); /* Thematic Background */
        background-size: cover;
        background-position: center;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
    }
    
    #loading-container {
        background-color: rgba(0, 0, 0, 0.85);
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 0 50px rgba(0,0,0,0.8);
        border: 2px solid #444;
        max-width: 400px;
        width: 80%;
    }
    
    h1 {
        margin: 0 0 20px 0;
        font-size: 28px;
        color: #ddd;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    
    #progress-container {
        width: 100%;
        height: 20px;
        background-color: #333;
        border-radius: 10px;
        overflow: hidden;
        margin: 20px 0;
        border: 1px solid #555;
    }
    
    #progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff3333, #ff8800);
        transition: width 0.2s;
    }
    
    #loading-text {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 20px;
        min-height: 20px;
    }

    .hidden {
      display: none !important;
    }

    .menu-grid {
      display: none;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .menu-grid.visible {
      display: grid;
    }

    .menu-button {
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #f7f7f7;
      background: linear-gradient(135deg, #2f6bff, #0b2a6a);
      box-shadow: 0 8px 24px rgba(47, 107, 255, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .menu-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 10px 28px rgba(47, 107, 255, 0.35);
    }

    .menu-button.secondary {
      background: linear-gradient(135deg, #2f8a5f, #11412a);
      box-shadow: 0 8px 24px rgba(47, 138, 95, 0.25);
    }

    .menu-button.warning {
      background: linear-gradient(135deg, #ff8d2f, #7f3e0f);
      box-shadow: 0 8px 24px rgba(255, 141, 47, 0.25);
    }

    .lobby-panel {
      display: none;
      margin-top: 16px;
      text-align: left;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 18px;
    }

    .lobby-panel h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #lobby-status,
    #lobby-message {
      font-size: 13px;
      color: #cfcfcf;
      margin-top: 8px;
      line-height: 1.45;
    }

    #lobby-players {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .lobby-player {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .lobby-ready {
      color: #57f287;
      font-weight: 700;
    }

    .lobby-not-ready {
      color: #ffcc66;
      font-weight: 700;
    }
  </style>
</head>
<body>
  
  <div id="loading-screen">
      <div id="loading-container">
          <h1>Simulador T3</h1>
          <div id="progress-container">
              <div id="progress-bar"></div>
          </div>
          <div id="loading-text">Carregando assets...</div>
            <div id="menu-panel" class="menu-grid">
              <button id="single-player-button" class="menu-button">Single Player</button>
              <button id="multiplayer-button" class="menu-button secondary">Multiplayer</button>
            </div>
            <div id="lobby-panel" class="lobby-panel">
              <h2>Lobby Multiplayer</h2>
              <div id="lobby-status">Conectando ao servidor...</div>
              <div id="lobby-players"></div>
              <button id="ready-button" class="menu-button warning" disabled>Ready</button>
              <div id="lobby-message"></div>
            </div>
      </div>
  </div>

  <div id="info">
    Velocidade: 0 km/h<br>
    Câmera: Aérea
  </div>
  
  <div id="instructions">
    <h3>Controles</h3>
    ↑ / W - Acelerar<br>
    ↓ / S - Freiar/Ré<br>
    ← / A - Esquerda<br>
    → / D - Direita<br>
    C - Trocar câmera
  </div>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  
  <!-- Cliente do Socket.io para o multiplayer -->
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script src="MultiplayerEngine.js?v=2026-05-29b"></script>
  
  <script type="module" src="main.js?v=2026-05-29b"></script>
</body>
</html>
